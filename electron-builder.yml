appId: net.ottomated.crewlinkkai.beta.local
productName: Better-CrewLinkKai
copyright: Copyright © 2021 OhMyGuus
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app

win:
  executableName: Better-CrewLinkKai
  publish:
    - provider: github
      owner: kuretoshi
      repo: BetterCrewLink
      releaseType: release
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  include: resources/installer.nsh
linux:
  target:
    - "AppImage"
  publish:
    - provider: github
      owner: kuretoshi
      repo: BetterCrewLink
      releaseType: release
