# cloudflared connects only to this loopback listener.
map $http_cf_connecting_ip $debug_auth_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 127.0.0.1:8766;
    server_name debug-auth.kuretoshi.work;

    location = / {
        return 302 https://debug-auth.kuretoshi.work/debug-register;
    }

    location ~ ^/(v1/debug-auth/(verify|register)|debug-register(/(register\.js|register\.css))?)$ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $debug_auth_client_ip;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
