appId: io.kuretoshi.tanukibcl.lite
extraMetadata:
  name: tanukibcllite
  version: 3.1.6-12
productName: TanukiBCLLite
copyright: Copyright © 2021 OhMyGuus
directories:
  output: dist-lite
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app

win:
  executableName: TanukiBCLLite
  publish:
    - provider: github
      owner: kuretoshi
      repo: BetterCrewLink
      releaseType: release
      channel: lite
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  include: resources/installer-lite.nsh
linux:
  target:
    - "AppImage"
  publish:
    - provider: github
      owner: kuretoshi
      repo: BetterCrewLink
      releaseType: release
      channel: lite
