appId: net.ottomated.crewlinkkai.lite
extraMetadata:
  name: bettercrewlinkkailite
  version: 3.2.11
productName: BetterCrewLinkKaiLite
copyright: Copyright © 2021 OhMyGuus
directories:
  output: dist-lite
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - out
asarUnpack:
  - "out/debug-reader/**"
  - "**/*.node"
npmRebuild: false

win:
  icon: resources/icon.ico
  executableName: TanukiBCLLite
  publish:
    - provider: github
      owner: kuretoshi
      repo: BetterCrewLink
      releaseType: release
      channel: lite
nsis:
  artifactName: TanukiBCLLite-Setup-${version}.${ext}
  include: resources/installer-lite.nsh
linux:
  target:
    - "AppImage"
  publish:
    - provider: github
      owner: kuretoshi
      repo: BetterCrewLink
      releaseType: release
      channel: lite
