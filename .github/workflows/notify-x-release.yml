name: Notify X of Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: x-release-${{ github.event.release.id }}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OAuth dependency
        run: python3 -m pip install --disable-pip-version-check requests-oauthlib==2.0.0
      - name: Post release to X
        env:
          X_PRODUCT_NAME: タヌキのベタクル
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 .github/scripts/post-x-release.py
