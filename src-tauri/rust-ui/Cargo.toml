[package]
name = "tbcl-rust-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust/WebAssembly UI for the Tauri edition"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
png = "0.18"
base64 = "0.22"
percent-encoding = "2"
url = "2"
web-sys = { version = "=0.3.107", features = ["Document", "DomRect", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "Location", "Node", "NodeList", "Window", "KeyboardEvent", "MouseEvent", "Storage", "Navigator", "Clipboard", "HtmlImageElement", "console", "VisibilityState"] }
